[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "welfare-politics-lab"
version = "0.2.0"
description = "Human-grounded evaluation of synthetic welfare allocation judgments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]
